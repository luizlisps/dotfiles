"$schema" = 'https://starship.rs/config-schema.json'

format = """
$directory\
$python\
${custom.git_branch_outside_home}\
$git_status\
$cmd_duration\
$line_break\
$character"""

[username]
style_user = "#839496"
style_root = "bold #cb4b16"
format = "[$user]($style) | "
show_always = true

[hostname]
style = "#586e75"
disabled = true
format = "[$hostname]($style) "
ssh_only = false
aliases = { "MacBook-Air" = "air" }

[directory]
style = "#268bd2"
format = "[$path]($style) "
truncation_length = 3

[git_branch]
disabled = true

[custom.git_branch_outside_home]
command = "git branch --show-current"
when = 'test "$PWD" != "$HOME" && git rev-parse --is-inside-work-tree >/dev/null 2>&1'
format = " :: [git:$output]($style)"
style = "#586e75"
shell = ["zsh", "--no-rcs"]

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "#586e75"

[git_status]
format = " $all_status$ahead_behind"
style = "#859900"
conflicted = "!"
untracked = "?"
modified = "*"
staged = "+"
renamed = ">"
deleted = "x"
stashed = "$"
ahead = "^"
behind = "v"
diverged = "<>"
up_to_date = ""

[cmd_duration]
format = " took:$duration "
style = "#b58900"

[haskell]
symbol = "λ"
style = "#6c71c4"
format = '([$symbol $version]($style) )'

[python]
format = "[$virtualenv]($style) "
style = "#586e75"
detect_extensions = []
detect_files = []

[character]
success_symbol = "[λ](bold #2aa198)"
error_symbol = "[λ](bold #dc322f)"
vimcmd_symbol = "[λ](bold #859900)"
vimcmd_visual_symbol = "[❮](bold #d33682)"
vimcmd_replace_symbol = "[❮](bold #dc322f)"
vimcmd_replace_one_symbol = "[❮](bold #dc322f)"
