# Color roles follow altercation/solarized's official tmuxcolors-light.conf.
set -g @theme_bg "#eee8d5"
set -g @theme_fg "#b58900"
set -g @theme_muted "#657b83"
set -g @theme_accent "#cb4b16"
set -g @theme_branch "#268bd2"
set -g @theme_git "#859900"
set -g @theme_time "#859900"
set -g @theme_border "#eee8d5"
set -g @theme_pane_active "#93a1a1"
set -g message-style "bg=#eee8d5,fg=#cb4b16"
set -g message-command-style "bg=#eee8d5,fg=#cb4b16"
set -g display-panes-active-colour "#268bd2"
set -g display-panes-colour "#cb4b16"
set -g clock-mode-colour "#859900"
