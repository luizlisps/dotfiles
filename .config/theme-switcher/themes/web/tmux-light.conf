# Classic web colors on a white canvas with neutral-gray separators.
set -g @theme_bg "#ffffff"
set -g @theme_fg "#000000"
set -g @theme_muted "#6b7280"
set -g @theme_accent "#0000ee"
set -g @theme_branch "#551a8b"
set -g @theme_git "#008000"
set -g @theme_time "#006a70"
set -g @theme_border "#d1d5db"
set -g @theme_pane_active "#0000ee"
set -g message-style "bg=#f3f4f6,fg=#0000ee"
set -g message-command-style "bg=#f3f4f6,fg=#0000ee"
set -g display-panes-active-colour "#0000ee"
set -g display-panes-colour "#551a8b"
set -g clock-mode-colour "#006a70"
