"$schema" = 'https://starship.rs/config-schema.json'

format = """
$directory\
$python\
${custom.git_branch_outside_home}\
$git_status\
$cmd_duration\
$line_break\
$character"""
palette = "web"

[palettes.web]
base00 = "#ffffff"
base01 = "#f3f4f6"
base02 = "#e5e7eb"
base03 = "#5b616e"
base04 = "#000000"
base05 = "#000000"
base06 = "#000000"
base07 = "#000000"
base08 = "#b00020"
base09 = "#8a4b00"
base0A = "#8a4b00"
base0B = "#008000"
base0C = "#006a70"
base0D = "#0000ee"
base0E = "#551a8b"
base0F = "#a31515"


[username]
    style_user = "base03"
    style_root = "bold base08"
format = "[$user]($style) | "
show_always = true

[hostname]
style = "base03"
disabled = true
format = "[$hostname]($style) "
ssh_only = false
aliases = { "MacBook-Air" = "air" }

[directory]
style = "base0D"
format = "[$path]($style) "
truncation_length = 3

[git_branch]
disabled = true

[custom.git_branch_outside_home]
command = "git branch --show-current"
when = 'test "$PWD" != "$HOME" && git rev-parse --is-inside-work-tree >/dev/null 2>&1'
format = " :: [git:$output]($style)"
style = "base03"
shell = ["zsh", "--no-rcs"]

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "base03"

[git_status]
format = " $all_status$ahead_behind"
style = "base0B"
conflicted = "!"
untracked = "?"
modified = "*"
staged = "+"
renamed = ">"
deleted = "x"
stashed = "$"
ahead = "^"
behind = "v"
diverged = "<>"
up_to_date = ""

[cmd_duration]
format = " took:$duration "
style = "base0A"

[haskell]
symbol = "λ"
style = "base0E"
format = '([$symbol $version]($style) )'

[python]
format = "[$virtualenv]($style) "
style = "base03"
detect_extensions = []
detect_files = []

[character]
success_symbol = "[λ](bold base0C)"
error_symbol = "[λ](bold base08)"
vimcmd_symbol = "[λ](bold base0B)"
