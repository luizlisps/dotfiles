"$schema" = 'https://starship.rs/config-schema.json'

format = """
$directory\
$python\
${custom.git_branch_outside_home}\
$git_status\
$cmd_duration\
$line_break\
$character"""

[username]
style_user = "#6b7280"
style_root = "bold #b00020"
format = "[$user]($style) | "
show_always = true

[hostname]
style = "#6b7280"
disabled = true
format = "[$hostname]($style) "
ssh_only = false
aliases = { "MacBook-Air" = "air" }

[directory]
style = "#0000ee"
format = "[$path]($style) "
truncation_length = 3

[git_branch]
disabled = true

[custom.git_branch_outside_home]
command = "git branch --show-current"
when = 'test "$PWD" != "$HOME" && git rev-parse --is-inside-work-tree >/dev/null 2>&1'
format = " :: [git:$output]($style)"
style = "#6b7280"
shell = ["zsh", "--no-rcs"]

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "#6b7280"

[git_status]
format = " $all_status$ahead_behind"
style = "#008000"
conflicted = "!"
untracked = "?"
modified = "*"
staged = "+"
renamed = ">"
deleted = "x"
stashed = "$"
ahead = "^"
behind = "v"
diverged = "<>"
up_to_date = ""

[cmd_duration]
format = " took:$duration "
style = "#8a4b00"

[haskell]
symbol = "λ"
style = "#551a8b"
format = '([$symbol $version]($style) )'

[python]
format = "[$virtualenv]($style) "
style = "#6b7280"
detect_extensions = []
detect_files = []

[character]
success_symbol = "[λ](bold #006a70)"
error_symbol = "[λ](bold #b00020)"
vimcmd_symbol = "[λ](bold #008000)"
