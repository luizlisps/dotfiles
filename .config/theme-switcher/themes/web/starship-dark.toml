"$schema" = 'https://starship.rs/config-schema.json'

format = """
$directory\
$python\
${custom.git_branch_outside_home}\
$git_status\
$cmd_duration\
$line_break\
$character"""
palette = "web"

[palettes.web]
background = "#111111"
surface = "#1c1c1c"
selection = "#30363d"
muted = "#b4b4b4"
operator = "#c9d1d9"
text = "#f5f5f5"
error = "#ff7b72"
number = "#f2cc60"
warning = "#f2cc60"
string = "#7ee787"
type = "#56d4dd"
link = "#8ab4f8"
keyword = "#d2a8ff"
constant = "#ffa198"


[username]
    style_user = "muted"
    style_root = "bold error"
format = "[$user]($style) | "
show_always = true

[hostname]
style = "muted"
disabled = true
format = "[$hostname]($style) "
ssh_only = false
aliases = { "MacBook-Air" = "air" }

[directory]
style = "link"
format = "[$path]($style) "
truncation_length = 3

[git_branch]
disabled = true

[custom.git_branch_outside_home]
command = "git branch --show-current"
when = 'test "$PWD" != "$HOME" && git rev-parse --is-inside-work-tree >/dev/null 2>&1'
format = " :: [git:$output]($style)"
style = "muted"
shell = ["zsh", "--no-rcs"]

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "muted"

[git_status]
format = " $all_status$ahead_behind"
style = "string"
conflicted = "!"
untracked = "?"
modified = "*"
staged = "+"
renamed = ">"
deleted = "x"
stashed = "$"
ahead = "^"
behind = "v"
diverged = "<>"
up_to_date = ""

[cmd_duration]
format = " took:$duration "
style = "warning"

[haskell]
symbol = "λ"
style = "keyword"
format = '([$symbol $version]($style) )'

[python]
format = "[$virtualenv]($style) "
style = "muted"
detect_extensions = []
detect_files = []

[character]
success_symbol = "[λ](bold type)"
error_symbol = "[λ](bold error)"
vimcmd_symbol = "[λ](bold string)"
vimcmd_visual_symbol = "[❮](bold keyword)"
vimcmd_replace_symbol = "[❮](bold error)"
vimcmd_replace_one_symbol = "[❮](bold error)"
