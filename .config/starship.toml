"$schema" = 'https://starship.rs/config-schema.json'

format = """
$directory\
$python\
${custom.git_branch_outside_home}\
$git_status\
$cmd_duration\
$line_break\
$character"""
palette = "solarized"

[palettes.solarized]
background = "#fdf6e3"
surface = "#eee8d5"
selection = "#eee8d5"
muted = "#93a1a1"
operator = "#586e75"
text = "#657b83"
error = "#dc322f"
number = "#d33682"
warning = "#b58900"
string = "#2aa198"
type = "#2aa198"
link = "#268bd2"
keyword = "#6c71c4"
constant = "#cb4b16"
success = "#859900"


[username]
    style_user = "muted"
    style_root = "bold error"
format = "[$user]($style) | "
show_always = true

[hostname]
style = "muted"
disabled = true
format = "[$hostname]($style) "
ssh_only = false
aliases = { "MacBook-Air" = "air" }

[directory]
style = "link"
format = "[$path]($style) "
truncation_length = 3

[git_branch]
disabled = true

[custom.git_branch_outside_home]
command = "git branch --show-current"
when = 'test "$PWD" != "$HOME" && git rev-parse --is-inside-work-tree >/dev/null 2>&1'
format = " :: [git:$output]($style)"
style = "bold link"
shell = ["zsh", "--no-rcs"]

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "warning"
[git_status]
format = " $all_status$ahead_behind"
style = "string"
conflicted = "[!](bold error)"
untracked = "[?](bold muted)"
modified = "[*](bold warning)"
staged = "[+](bold success)"
renamed = "[>](bold type)"
deleted = "[x](bold error)"
stashed = "[$](bold muted)"
ahead = "[^](bold link)"
behind = "[v](bold warning)"
diverged = "[<>](bold error)"
up_to_date = ""


[cmd_duration]
format = " took:$duration "
style = "warning"

[haskell]
symbol = "λ"
style = "keyword"
format = '([$symbol $version]($style) )'

[python]
format = "[$virtualenv]($style) "
style = "muted"
detect_extensions = []
detect_files = []

[character]
success_symbol = "[λ](bold type)"
error_symbol = "[λ](bold error)"
vimcmd_symbol = "[λ](bold string)"
