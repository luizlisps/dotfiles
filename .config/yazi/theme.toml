#:schema https://yazi-rs.github.io/schemas/theme.json

# seoul256 dark (junegunn/seoul256.vim), background 237. Each element takes the
# colours of its Vim highlight group: StatusLine for modes, TabLineSel/TabLine
# for tabs, PmenuSel for selection, Visual/Search/DiffAdd/Error for marks,
# VertSplit for borders, Title for titles, CursorLineNr for the active item.
[app]
overall = { bg = "#4b4b4b" }

[mgr]
cwd = { fg = "#dfdebd" }
find_keyword = { fg = "#f1f1f1", bg = "#007299", bold = true }
find_position = { fg = "#bdbdbd", italic = true }
symlink_target = { fg = "#bdbdbd", italic = true }
marker_copied = { fg = "#d9d9d9", bg = "#006f00" }
marker_cut = { fg = "#d9d9d9", bg = "#730b00" }
marker_marked = { fg = "#d9d9d9", bg = "#007173" }
marker_selected = { fg = "#f1f1f1", bg = "#730b00" }
count_copied = { fg = "#d9d9d9", bg = "#006f00" }
count_cut = { fg = "#d9d9d9", bg = "#730b00" }
count_selected = { fg = "#f1f1f1", bg = "#730b00" }
border_style = { fg = "#333233" }

[tabs]
active = { fg = "#f1f1f1", bg = "#007173", bold = true }
inactive = { fg = "#e9e9e9", bg = "#616161" }

[mode]
normal_main = { fg = "#dfdebd", bg = "#730b00", bold = true }
normal_alt = { fg = "#dfdebd", bg = "#616161" }
select_main = { fg = "#f1f1f1", bg = "#007173", bold = true }
select_alt = { fg = "#dfdebd", bg = "#616161" }
unset_main = { fg = "#d9d9d9", bg = "#730b00", bold = true }
unset_alt = { fg = "#dfdebd", bg = "#616161" }

[status]
overall = { fg = "#d9d9d9" }
perm_sep = { fg = "#333233" }
perm_type = { fg = "#bce0ff" }
perm_read = { fg = "#dfbc72" }
perm_write = { fg = "#ffbfbd" }
perm_exec = { fg = "#bcddbd" }
progress_label = { bold = true }
progress_normal = { fg = "#dfdebd", bg = "#730b00" }
progress_error = { fg = "#d9d9d9", bg = "#730b00" }

[which]
border = { fg = "#333233" }
cand = { fg = "#bce0ff" }
rest = { fg = "#bdbdbd" }
desc = { fg = "#dfdebd" }
separator_style = { fg = "#333233" }

[confirm]
border = { fg = "#333233" }
title = { fg = "#e0bebc" }
btn_yes = { fg = "#dfdebd", bg = "#730b00", bold = true }

[spot]
border = { fg = "#333233" }
title = { fg = "#e0bebc" }
tbl_col = { fg = "#bcdede" }
tbl_cell = { fg = "#f1f1f1", bg = "#730b00" }

[notify]
title_info = { fg = "#bce0ff" }
title_warn = { fg = "#dfbc72" }
title_error = { fg = "#ffbfbd" }

[pick]
border = { fg = "#333233" }
active = { fg = "#e0bebc", bold = true }

[input]
border = { fg = "#333233" }

[cmp]
border = { fg = "#333233" }

[tasks]
border = { fg = "#333233" }
hovered = { fg = "#e0bebc", bold = true }

[help]
border = { fg = "#333233" }
chord = { fg = "#bce0ff" }
hovered = { reversed = true, bold = true }

# Emoji only where one has a real equivalent; other icons keep yazi's defaults.
[icon]
prepend_conds = [
    { if = "dir", text = "📁" },
]
prepend_exts = [
    { name = "md", text = "📝" },
    { name = "txt", text = "📄" },
    { name = "png", text = "🖼️" },
    { name = "jpg", text = "🖼️" },
    { name = "jpeg", text = "🖼️" },
    { name = "gif", text = "🖼️" },
    { name = "webp", text = "🖼️" },
    { name = "svg", text = "🖼️" },
    { name = "pdf", text = "📕" },
    { name = "zip", text = "📦" },
    { name = "tar", text = "📦" },
    { name = "gz", text = "📦" },
    { name = "lock", text = "🔒" },
    { name = "py", text = "🐍" },
    { name = "rs", text = "🦀" },
    { name = "rb", text = "💎" },
    { name = "java", text = "☕" },
    { name = "lua", text = "🌙" },
    { name = "sql", text = "🗄️" },
    { name = "html", text = "🌐" },
    { name = "sh", text = "🐚" },
    { name = "zsh", text = "🐚" },
]
