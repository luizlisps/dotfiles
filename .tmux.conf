# Configuracao pessoal do tmux (tmux 3.7c)
# Prefixo: Ctrl-a. Recarregar: Ctrl-a Shift-r.
# "Janela" e a aba do tmux; "painel" e uma divisao dentro da janela.
#
# Atalhos principais (todos apos o prefixo, exceto dentro de um modo):
#   | / -          dividir painel lado a lado / um acima do outro
#   b / B          rodar comando em janela de fundo (ex.: pnpm dev) / listar essas janelas
#   h j k l        selecionar painel: esquerda, baixo, cima, direita
#   H J K L        trocar painel de posicao sem mudar o layout
#   t              modo tiling: h/j/k/l move o painel ativo ate uma borda
#   r              modo resize: h/j/k/l ajusta em 5 celulas
#   R              recarregar esta configuracao
#   < / >          mover a janela atual entre as abas
#   T + N          jogar o painel ativo para a janela N (cria se nao existir)
#   S              abrir sessao persistente no servidor (srv) em janela nova
#   Alt-1..9       ir para a sessao N, por ordem de criacao (sem prefixo)
# Esc, q ou a tecla do proprio modo encerram tiling/resize.

# Prefixo e comportamento geral.
unbind C-b
set -g prefix C-a
bind C-a send-prefix
bind R source-file ~/.tmux.conf \; display-message 'tmux config reloaded'

set -g mouse on
set -g history-limit 100000
set -g escape-time 0
set -g focus-events on
set -g allow-passthrough on
set -g set-clipboard on
set -g base-index 1
set -g renumber-windows on
setw -g pane-base-index 1

# Criacao: conservar o diretorio do painel ativo.
bind c new-window -c '#{pane_current_path}'
bind '"' split-window -v -c '#{pane_current_path}'
bind % split-window -h -c '#{pane_current_path}'
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'

# Processo em segundo plano: pede um comando e o roda numa janela nova,
# no diretorio do painel ativo, sem tirar o foco da janela atual.
# remain-on-exit failed segura a janela so se o processo falhar, para o erro
# continuar legivel; respawn-window reinicia. new-window sem -d torna a janela
# atual para que set -w a alcance; last-window devolve o foco. @bg marca a
# janela para a barra.
bind b command-prompt -p 'bg:' { new-window -c '#{pane_current_path}' -n '%1' '%1' ; set -w remain-on-exit failed ; set -w @bg 1 ; last-window }
# Lista so as janelas @bg de todas as sessoes, com preview da saida. Enter ou
# o numero da linha pula para ela; x mata; Esc sai. -Z abre em tela cheia.
bind B choose-tree -Zw -f '#{@bg}' -F '#{?window_format,#W - #{?pane_dead,saiu com #{pane_dead_status},rodando},#{session_windows} janelas}'

# Navegacao e trocas. Remover atalhos herdados que disputam essas teclas
# ou interferem em sequencias enviadas aos programas no terminal.
unbind -T prefix Up
unbind -T prefix Down
unbind -T prefix Left
unbind -T prefix Right
unbind -T prefix M-Up
unbind -T prefix M-Down
unbind -T prefix M-Left
unbind -T prefix M-Right
unbind -T prefix o
unbind -T prefix ';'
unbind -T prefix q

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H swap-pane -d -t '{left-of}'
bind -r J swap-pane -d -t '{down-of}'
bind -r K swap-pane -d -t '{up-of}'
bind -r L swap-pane -d -t '{right-of}'

# Mover abas sem passar da primeira ou da ultima.
bind -r '<' if-shell -F '#{!=:#{window_start_flag},1}' 'swap-window -d -t -1'
bind -r '>' if-shell -F '#{!=:#{window_end_flag},1}' 'swap-window -d -t +1'

# Jogar o painel ativo para a janela N (um digito, sem Enter); cria a janela
# se o indice nao existir. -d mantem o foco onde esta. Se o painel e o unico da
# janela, break-pane falharia: move-window leva a janela inteira para o indice.
bind T command-prompt -1 -p 'throw pane to window:' {
  if-shell "tmux list-windows -F '##{window_index}' | grep -qx '%1'" {
    join-pane -d -t ':%1'
  } {
    if-shell -F '#{==:#{window_panes},1}' { move-window -d -t ':%1' } { break-pane -d -t ':%1' }
  }
}

# Alt-1..9: ir para a sessao N, por ordem de criacao (estavel ao renomear).
bind -n M-1 run-shell '~/.local/bin/tmux-session-n 1'
bind -n M-2 run-shell '~/.local/bin/tmux-session-n 2'
bind -n M-3 run-shell '~/.local/bin/tmux-session-n 3'
bind -n M-4 run-shell '~/.local/bin/tmux-session-n 4'
bind -n M-5 run-shell '~/.local/bin/tmux-session-n 5'
bind -n M-6 run-shell '~/.local/bin/tmux-session-n 6'
bind -n M-7 run-shell '~/.local/bin/tmux-session-n 7'
bind -n M-8 run-shell '~/.local/bin/tmux-session-n 8'
bind -n M-9 run-shell '~/.local/bin/tmux-session-n 9'

# Servidor: o tmux do srv e so a camada de persistencia (sem barra nem prefixo,
# ver ~/.tmux.conf de la); este tmux e a unica interface. Pede o nome da sessao
# remota e abre uma janela local que reconecta se o SSH cair.
bind S command-prompt -p 'srv session:' -I main { new-window -n 'srv:%1' '~/.local/bin/ssh-tmux srv %1' }

# Modos de teclado. switch-client -T consome uma tecla; repetir o comando
# ao fim de cada acao mantem o modo ativo. refresh-client atualiza a barra.
bind r switch-client -T resize \; refresh-client -S
bind -T resize h resize-pane -L 5 \; switch-client -T resize \; refresh-client -S
bind -T resize j resize-pane -D 5 \; switch-client -T resize \; refresh-client -S
bind -T resize k resize-pane -U 5 \; switch-client -T resize \; refresh-client -S
bind -T resize l resize-pane -R 5 \; switch-client -T resize \; refresh-client -S
bind -T resize Escape switch-client -T root \; refresh-client -S
bind -T resize r switch-client -T root \; refresh-client -S
bind -T resize q switch-client -T root \; refresh-client -S

# Tiling: -f cria a divisao na altura/largura inteira da janela. Assim,
# somente o painel ativo muda de lugar; os outros preservam seu agrupamento.
# -b escolhe esquerda/cima; sem -b, direita/baixo. {next} e outro painel
# da mesma janela (inclusive quando o ativo e o ultimo). H/V na barra indica
# a orientacao ativa no modo.
# Se o painel ja ocupa a borda inteira (ou e o unico), a tecla nao faz nada:
# repetir o movimento dividiria a janela de novo e esmagaria os outros.
# Depois de mover, select-layout -E iguala o painel ativo e o grupo restante.
set -g @tile-left   '#{||:#{==:#{window_panes},1},#{&&:#{pane_at_left},#{==:#{pane_height},#{window_height}}}}'
set -g @tile-right  '#{||:#{==:#{window_panes},1},#{&&:#{pane_at_right},#{==:#{pane_height},#{window_height}}}}'
set -g @tile-top    '#{||:#{==:#{window_panes},1},#{&&:#{pane_at_top},#{==:#{pane_width},#{window_width}}}}'
set -g @tile-bottom '#{||:#{==:#{window_panes},1},#{&&:#{pane_at_bottom},#{==:#{pane_width},#{window_width}}}}'
unbind '{'
unbind '}'
bind t switch-client -T tile-horizontal \; refresh-client -S
bind -T tile-horizontal h if-shell -F '#{E:@tile-left}' '' { move-pane -f -h -b -t '{next}' ; select-layout -E -t '{next}' ; select-layout -E } \; switch-client -T tile-horizontal \; refresh-client -S
bind -T tile-horizontal l if-shell -F '#{E:@tile-right}' '' { move-pane -f -h -t '{next}' ; select-layout -E -t '{next}' ; select-layout -E } \; switch-client -T tile-horizontal \; refresh-client -S
bind -T tile-horizontal j if-shell -F '#{E:@tile-bottom}' '' { move-pane -f -v -t '{next}' ; select-layout -E -t '{next}' ; select-layout -E } \; switch-client -T tile-vertical \; refresh-client -S
bind -T tile-horizontal k if-shell -F '#{E:@tile-top}' '' { move-pane -f -v -b -t '{next}' ; select-layout -E -t '{next}' ; select-layout -E } \; switch-client -T tile-vertical \; refresh-client -S
bind -T tile-vertical h if-shell -F '#{E:@tile-left}' '' { move-pane -f -h -b -t '{next}' ; select-layout -E -t '{next}' ; select-layout -E } \; switch-client -T tile-horizontal \; refresh-client -S
bind -T tile-vertical l if-shell -F '#{E:@tile-right}' '' { move-pane -f -h -t '{next}' ; select-layout -E -t '{next}' ; select-layout -E } \; switch-client -T tile-horizontal \; refresh-client -S
bind -T tile-vertical j if-shell -F '#{E:@tile-bottom}' '' { move-pane -f -v -t '{next}' ; select-layout -E -t '{next}' ; select-layout -E } \; switch-client -T tile-vertical \; refresh-client -S
bind -T tile-vertical k if-shell -F '#{E:@tile-top}' '' { move-pane -f -v -b -t '{next}' ; select-layout -E -t '{next}' ; select-layout -E } \; switch-client -T tile-vertical \; refresh-client -S
bind -T tile-horizontal Escape switch-client -T root \; refresh-client -S
bind -T tile-horizontal t switch-client -T root \; refresh-client -S
bind -T tile-horizontal q switch-client -T root \; refresh-client -S
bind -T tile-vertical Escape switch-client -T root \; refresh-client -S
bind -T tile-vertical t switch-client -T root \; refresh-client -S
bind -T tile-vertical q switch-client -T root \; refresh-client -S

# Copy mode em estilo vi; y copia a selecao para a area de transferencia macOS.
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'

# Terminal e tema.
set -g default-terminal 'tmux-256color'
# Cor RGB; um indice fixo evita duplicar a entrada a cada recarga.
set -s terminal-features[10] 'xterm*:RGB'
# seoul256 dark (junegunn/seoul256.vim, background 237); each role uses the
# colour the Vim scheme gives it: current = CursorLineNr, mode = ModeMsg,
# borders = VertSplit, messages = StatusLine.
set -g @theme_bg "#4b4b4b"
set -g @theme_fg "#d9d9d9"
set -g @theme_muted "#bdbdbd"
set -g @theme_accent "#e0bebc"
set -g @theme_mode "#ffbd98"
set -g @theme_branch "#bce0ff"
set -g @theme_time "#bcdede"
set -g @theme_border "#333233"
set -g @theme_error "#ffbfbd"
set -g @theme_pane_active "#e09b99"
set -g @theme_status_bg "#730b00"
set -g message-style "bg=#730b00,fg=#dfdebd,bold"
set -g message-command-style "bg=#730b00,fg=#dfdebd,bold"
set -g display-panes-active-colour "#e0bebc"
set -g display-panes-colour "#bdbdbd"
set -g clock-mode-colour "#bcdede"
# Copy mode, popups e menus: sem isto o tmux usa yellow/cyan/magenta com fg=black,
# e o "black" da paleta (#616161) fica quase ilegivel sobre o fundo.
set -g mode-style "bg=#007173,fg=#f1f1f1,noattr"
set -g copy-mode-match-style "bg=#98bcbd,fg=#3f3f3f"
set -g copy-mode-current-match-style "bg=#e19972,fg=#3f3f3f"
set -g copy-mode-mark-style "bg=#e09b99,fg=#3f3f3f"
set -g copy-mode-current-line-number-style "fg=#e0bebc"
set -g copy-mode-line-number-style "fg=#bdbdbd"
set -g popup-style "bg=#{@theme_bg},fg=#{@theme_fg}"
set -g popup-border-style "fg=#{@theme_muted}"
set -g menu-style "bg=#{@theme_bg},fg=#{@theme_fg}"
set -g menu-selected-style "bg=#730b00,fg=#dfdebd"
set -g menu-border-style "fg=#{@theme_muted}"
# O prompt e desenhado sobre a barra: preencher a linha inteira evita
# que janelas e blocos aparecam atras de Ctrl-a :.
set -g message-format '#[fill=#{@theme_status_bg}]#[#{?#{command_prompt},#{E:message-command-style},#{E:message-style}}]#{message}'

# Barra: git a esquerda; sessao e janelas no centro; pasta e data a direita.
set -g status-interval 5
set -g status-position top
set -g status-justify absolute-centre
set -g status-style 'bg=#{@theme_bg},fg=#{@theme_fg}'
set -g status-left-length 60
set -g status-left '#[fg=#{@theme_branch},bold] #(~/.local/bin/tmux-git-status #{q:pane_current_path}) #[default]'
set -g window-status-separator ''
set -g window-status-style 'fg=#{@theme_muted}'
set -g window-status-current-style 'fg=#{@theme_accent},bold'
set -g window-status-activity-style 'fg=#{@theme_branch},bold'
set -g window-status-bell-style 'fg=#{@theme_branch},bold'
# O nome da sessao entra antes da primeira janela, para ficar no centro com elas.
set -g @status-session '#{?window_start_flag,#[fg=#{@theme_muted}]#[nobold]@#S #[default],}'
# Janelas de segundo plano (Ctrl-a b) ganham & antes do indice: ciano rodando,
# vermelho quando o processo morreu com erro.
set -g @status-bg '#{?@bg,#[fg=#{?pane_dead,#{@theme_error},#{@theme_time}}]&#[default],}'
set -g window-status-format '#{E:@status-session} #{E:@status-bg}#I:#W '
set -g window-status-current-format '#{E:@status-session} #{E:@status-bg}#I:#W '
# Blocos sem fundo nem divisoria, so o texto colorido; modos so aparecem quando ativos.
set -g @status-mode '#{?#{==:#{client_key_table},resize}, #[fg=#{@theme_mode}]#[bold] RESIZE ,}#{?#{==:#{client_key_table},tile-horizontal}, #[fg=#{@theme_mode}]#[bold] TILE H ,}#{?#{==:#{client_key_table},tile-vertical}, #[fg=#{@theme_mode}]#[bold] TILE V ,}'
set -g status-right-length 110
set -g status-right '#[fg=#{@theme_fg}] #{s|^.*/([^/]+/[^/]+)$|\1|:pane_current_path} #[fg=#{@theme_time}] %Y/%m/%d %H:%M #{E:@status-mode}#[default]'
set -gu status-format

# Bordas dos paineis: neutra nos inativos, destaque no ativo.
set -g pane-border-status off
set -g pane-border-style 'fg=#{@theme_border}'
set -g pane-active-border-style 'fg=#{@theme_pane_active},bold'
set -g pane-border-lines simple

# Claude Code native binary is named after its version (e.g. 2.1.296); show "claude" instead
set -g automatic-rename-format '#{?#{m/r:^[0-9]+\.[0-9]+\.[0-9]+$,#{pane_current_command}},claude,#{pane_current_command}}'

# Titulo do terminal e sessao seguinte ao fechar uma sessao.
set -g set-titles on
set -g set-titles-string '#S:#W'
set -g detach-on-destroy off
set -g status-keys vi
