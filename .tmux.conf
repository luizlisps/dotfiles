# tmux user configuration
# Reload with: prefix + r

# Prefix: Ctrl-a is easier to reach than the tmux default Ctrl-b.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# General behavior
set -g mouse on
set -g history-limit 100000
set -g escape-time 0
set -g focus-events on
set -g allow-passthrough on
set -g set-clipboard on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Keep new panes and windows in the current directory.
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Easier split bindings.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Pane navigation is only Ctrl-a + h/j/k/l.
unbind -n M-h
unbind -n M-j
unbind -n M-k
unbind -n M-l
unbind -T prefix M-h
unbind -T prefix M-j
unbind -T prefix M-k
unbind -T prefix M-l
unbind -T prefix Up
unbind -T prefix Down
unbind -T prefix Left
unbind -T prefix Right
unbind -T prefix M-Up
unbind -T prefix M-Down
unbind -T prefix M-Left
unbind -T prefix M-Right
unbind -T prefix o
unbind -T prefix ';'
unbind -T prefix q
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# Move the active pane toward the top/left or bottom/right.
bind -r '<' swap-pane -U
bind -r '>' swap-pane -D

# Convert a stacked two-pane layout and place the active pane on the left.
bind-key '{' select-layout even-horizontal \; swap-pane -t '{left}'
# Convert a side-by-side two-pane layout and place the active pane at the bottom.
bind-key '}' select-layout even-vertical \; swap-pane -t '{bottom}'

# Vim-style pane resizing; repeat while holding the prefix.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Reload configuration.
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# Vi keys in copy mode, with macOS clipboard integration.
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# Terminal and color support.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Adaptive Solarized palette follows the macOS appearance.
source-file ~/.config/theme-switcher/current-tmux.conf

# Top status: git left, session and windows centered, context and time right.
set -g status-interval 5
set -g status-position top
set -g status-justify absolute-centre
set -g status-style "bg=#{@theme_bg},fg=#{@theme_fg}"
set -g status-left-style "bg=#{@theme_bg},fg=#{@theme_fg}"
set -g window-status-format "#[fg=#{@theme_muted}]#I:#W #[default]"
set -g window-status-current-format "#[fg=#{@theme_accent},bold]#I:#W #[default]"
set -g status-left '#[fg=#{@theme_branch},bg=#{@theme_bg},bold]#(git -C #{q:pane_current_path} branch --show-current 2>/dev/null | sed "s/.*/[&]/")#[fg=#{@theme_fg},bg=#{@theme_bg}]#[fg=#{@theme_git},bg=#{@theme_bg}]#(cd #{q:pane_current_path} && starship module git_status 2>/dev/null)#[fg=#{@theme_fg},bg=#{@theme_bg}] '
set -g status-right '#[fg=#{@theme_accent}][#{s|^.*/([^/]+/[^/]+)$|\1|:pane_current_path}] #[fg=#{@theme_muted}]| #[fg=#{@theme_time}]%Y/%m/%d %H:%M #[default]'
set -g status-format[0] '#[align=left]#{E:status-left}#[list=on align=absolute-centre]#[fg=#{@theme_branch},bold]@#S #[default]#{W:#[range=window|#{window_index}]#{E:window-status-format}#[norange],#[range=window|#{window_index}]#{E:window-status-current-format}#[norange]}#[nolist]#[align=right]#{T:status-right}'
set -g pane-border-status off
# Pane separators: use a stronger neutral and accent color for clear divisions.
set -g pane-border-style "fg=#{@theme_border}"
set -g pane-active-border-style "fg=#{@theme_pane_active},bold"
set -g pane-border-lines simple
