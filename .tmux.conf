# Configuracao pessoal do tmux (tmux 3.7c)
# Prefixo: Ctrl-a. Recarregar: Ctrl-a Shift-r.
# "Janela" e a aba do tmux; "painel" e uma divisao dentro da janela.
#
# Atalhos principais (todos apos o prefixo, exceto dentro de um modo):
#   | / -          dividir painel lado a lado / um acima do outro
#   h j k l        selecionar painel: esquerda, baixo, cima, direita
#   H J K L        trocar painel de posicao sem mudar o layout
#   t              modo tiling: h/j/k/l move o painel ativo ate uma borda
#   r              modo resize: h/j/k/l ajusta em 5 celulas
#   R              recarregar esta configuracao
#   < / >          mover a janela atual entre as abas
# Esc, q ou a tecla do proprio modo encerram tiling/resize.

# Prefixo e comportamento geral.
unbind C-b
set -g prefix C-a
bind C-a send-prefix
bind R source-file ~/.tmux.conf \; display-message 'tmux config reloaded'

set -g mouse on
set -g history-limit 100000
set -g escape-time 0
set -g focus-events on
set -g allow-passthrough on
set -g set-clipboard on
set -g base-index 1
set -g renumber-windows on
setw -g pane-base-index 1

# Criacao: conservar o diretorio do painel ativo.
bind c new-window -c '#{pane_current_path}'
bind '"' split-window -v -c '#{pane_current_path}'
bind % split-window -h -c '#{pane_current_path}'
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'

# Navegacao e trocas. Remover atalhos herdados que disputam essas teclas
# ou interferem em sequencias enviadas aos programas no terminal.
unbind -n M-h
unbind -n M-j
unbind -n M-k
unbind -n M-l
unbind -T prefix M-h
unbind -T prefix M-j
unbind -T prefix M-k
unbind -T prefix M-l
unbind -T prefix Up
unbind -T prefix Down
unbind -T prefix Left
unbind -T prefix Right
unbind -T prefix M-Up
unbind -T prefix M-Down
unbind -T prefix M-Left
unbind -T prefix M-Right
unbind -T prefix o
unbind -T prefix ';'
unbind -T prefix q

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H swap-pane -d -t '{left-of}'
bind -r J swap-pane -d -t '{down-of}'
bind -r K swap-pane -d -t '{up-of}'
bind -r L swap-pane -d -t '{right-of}'

# Mover abas sem passar da primeira ou da ultima.
bind -r '<' if-shell -F '#{!=:#{window_start_flag},1}' 'swap-window -d -t -1'
bind -r '>' if-shell -F '#{!=:#{window_end_flag},1}' 'swap-window -d -t +1'

# Alt-1..9: ir para a sessao N (ordem alfabetica, a mesma do numero na barra).
bind -n M-1 run-shell 's=$(tmux list-sessions -F "##{session_name}" | sed -n 1p); [ -n "$s" ] && tmux switch-client -t "$s"'
bind -n M-2 run-shell 's=$(tmux list-sessions -F "##{session_name}" | sed -n 2p); [ -n "$s" ] && tmux switch-client -t "$s"'
bind -n M-3 run-shell 's=$(tmux list-sessions -F "##{session_name}" | sed -n 3p); [ -n "$s" ] && tmux switch-client -t "$s"'
bind -n M-4 run-shell 's=$(tmux list-sessions -F "##{session_name}" | sed -n 4p); [ -n "$s" ] && tmux switch-client -t "$s"'
bind -n M-5 run-shell 's=$(tmux list-sessions -F "##{session_name}" | sed -n 5p); [ -n "$s" ] && tmux switch-client -t "$s"'
bind -n M-6 run-shell 's=$(tmux list-sessions -F "##{session_name}" | sed -n 6p); [ -n "$s" ] && tmux switch-client -t "$s"'
bind -n M-7 run-shell 's=$(tmux list-sessions -F "##{session_name}" | sed -n 7p); [ -n "$s" ] && tmux switch-client -t "$s"'
bind -n M-8 run-shell 's=$(tmux list-sessions -F "##{session_name}" | sed -n 8p); [ -n "$s" ] && tmux switch-client -t "$s"'
bind -n M-9 run-shell 's=$(tmux list-sessions -F "##{session_name}" | sed -n 9p); [ -n "$s" ] && tmux switch-client -t "$s"'

# Modos de teclado. switch-client -T consome uma tecla; repetir o comando
# ao fim de cada acao mantem o modo ativo. refresh-client atualiza a barra.
bind r switch-client -T resize \; refresh-client -S
bind -T resize h resize-pane -L 5 \; switch-client -T resize \; refresh-client -S
bind -T resize j resize-pane -D 5 \; switch-client -T resize \; refresh-client -S
bind -T resize k resize-pane -U 5 \; switch-client -T resize \; refresh-client -S
bind -T resize l resize-pane -R 5 \; switch-client -T resize \; refresh-client -S
bind -T resize Escape switch-client -T root \; refresh-client -S
unbind -q -T resize R
bind -T resize r switch-client -T root \; refresh-client -S
bind -T resize q switch-client -T root \; refresh-client -S

# Tiling: -f cria a divisao na altura/largura inteira da janela. Assim,
# somente o painel ativo muda de lugar; os outros preservam seu agrupamento.
# -b escolhe esquerda/cima; sem -b, direita/baixo. {next} e outro painel
# da mesma janela (inclusive quando o ativo e o ultimo). H/V na barra indica
# a orientacao ativa no modo. Precisa haver pelo menos dois paineis.
unbind '{'
unbind '}'
bind t switch-client -T tile-horizontal \; refresh-client -S
bind -T tile-horizontal h move-pane -f -h -b -t '{next}' \; switch-client -T tile-horizontal \; refresh-client -S
bind -T tile-horizontal l move-pane -f -h -t '{next}' \; switch-client -T tile-horizontal \; refresh-client -S
bind -T tile-horizontal j move-pane -f -v -t '{next}' \; switch-client -T tile-vertical \; refresh-client -S
bind -T tile-horizontal k move-pane -f -v -b -t '{next}' \; switch-client -T tile-vertical \; refresh-client -S
bind -T tile-vertical h move-pane -f -h -b -t '{next}' \; switch-client -T tile-horizontal \; refresh-client -S
bind -T tile-vertical l move-pane -f -h -t '{next}' \; switch-client -T tile-horizontal \; refresh-client -S
bind -T tile-vertical j move-pane -f -v -t '{next}' \; switch-client -T tile-vertical \; refresh-client -S
bind -T tile-vertical k move-pane -f -v -b -t '{next}' \; switch-client -T tile-vertical \; refresh-client -S
bind -T tile-horizontal Escape switch-client -T root \; refresh-client -S
bind -T tile-horizontal t switch-client -T root \; refresh-client -S
bind -T tile-horizontal q switch-client -T root \; refresh-client -S
bind -T tile-vertical Escape switch-client -T root \; refresh-client -S
bind -T tile-vertical t switch-client -T root \; refresh-client -S
bind -T tile-vertical q switch-client -T root \; refresh-client -S

# Copy mode em estilo vi; y copia a selecao para a area de transferencia macOS.
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'

# Terminal e tema. O arquivo de tema acompanha a aparencia do macOS.
set -g default-terminal 'tmux-256color'
# Acrescentar RGB uma vez so, inclusive apos Ctrl-a Shift-r.
if-shell -F '#{!:#{m:*xterm-256color:RGB*,#{terminal-features}}}' "set -as terminal-features ',xterm-256color:RGB'"
source-file ~/.config/theme-switcher/current-tmux.conf
# O prompt e desenhado sobre a barra: preencher a linha inteira evita
# que janelas e blocos aparecam atras de Ctrl-a :.
set -g message-format '#[fill=#{@theme_accent}]#[#{?#{command_prompt},#{E:message-command-style},#{E:message-style}}]#{message}'

# Barra: numero da sessao a esquerda; nome da sessao e janelas centralizados;
# branch, pasta e data a direita. O numero e a posicao da sessao em ordem
# alfabetica, contando a partir de 1 (o mesmo usado por Alt-1..9).
set -g status-interval 5
set -g status-position top
set -g status-justify absolute-centre
set -g status-style 'bg=#{@theme_bg},fg=#{@theme_fg}'
set -g @session-index '#{n:#{S:#{?#{<=:#{session_name},#{client_session}},x,}}}'
set -g status-left-length 10
set -g status-left '#[fg=#{@theme_accent},bold] #{E:@session-index} #[default]'
set -g window-status-separator ''
set -g window-status-style 'fg=#{@theme_muted}'
set -g window-status-current-style 'fg=#{@theme_accent},bold'
set -g window-status-activity-style 'fg=#{@theme_branch},bold'
set -g window-status-bell-style 'fg=#{@theme_branch},bold'
set -g window-status-format ' #I:#W '
set -g window-status-current-format ' #I:#W '
# Blocos sem fundo nem divisoria, so o texto colorido; modos so aparecem quando ativos.
set -g @status-mode '#{?#{==:#{client_key_table},resize}, #[fg=#{@theme_accent}]#[bold] RESIZE ,}#{?#{==:#{client_key_table},tile-horizontal}, #[fg=#{@theme_accent}]#[bold] TILE H ,}#{?#{==:#{client_key_table},tile-vertical}, #[fg=#{@theme_accent}]#[bold] TILE V ,}'
set -g status-right-length 110
set -g status-right '#[fg=#{@theme_branch},bold] #(~/.local/bin/tmux-git-status #{q:pane_current_path}) #[nobold,fg=#{@theme_fg}] #{s|^.*/([^/]+/[^/]+)$|\1|:pane_current_path} #[fg=#{@theme_time}] %Y/%m/%d %H:%M #{E:@status-mode}#[default]'
# Formato padrao do tmux 3.7 com o nome da sessao inserido antes da lista
# de janelas, para que ambos fiquem juntos no centro.
set -g @status-session '#[fg=#{@theme_muted}] @#S #[default]'
set -g status-format[0] '#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{E:@status-session}#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?loop_last_flag,,#{E:window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?loop_last_flag,,#{E:window-status-separator}}}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]'

# Bordas dos paineis: neutra nos inativos, destaque no ativo.
set -g pane-border-status off
set -g pane-border-style 'fg=#{@theme_border}'
set -g pane-active-border-style 'fg=#{@theme_pane_active},bold'
set -g pane-border-lines simple
