# tmux do servidor: so a camada de persistencia (tmux 3.5+).
# A interface e o tmux local (Ctrl-a, barra, Alt-1..9, tiling), que abre estas
# sessoes com Ctrl-a S (~/.local/bin/ssh-tmux). Aqui nao ha barra nem prefixo,
# para as teclas passarem direto ao tmux local.
# Copia: Ctrl-Alt-b entra no copy mode deste tmux (historico daqui); v/y no vi.

# Remover atalhos herdados (ao recarregar com source-file).
unbind -a -T root
unbind -a -T prefix

set -g status off
set -g prefix None
set -g prefix2 None
set -g mouse off

# 10 ms: sobre SSH, sequencias de Alt/setas podem chegar quebradas e virar Esc.
set -g escape-time 10
set -g history-limit 100000
set -g focus-events on
set -g allow-passthrough on
set -g set-clipboard on
set -g base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
set -g status-keys vi
setw -g mode-keys vi
setw -g pane-base-index 1

bind -n C-M-b copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Cor RGB e OSC 52: a copia sobe pelo tmux local ate o terminal.
set -g default-terminal 'tmux-256color'
set -s terminal-features[10] 'xterm*:RGB'
set -as terminal-features ',*:clipboard'
